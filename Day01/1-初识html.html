<!-- ctrl + / html注释快捷键  !按下回车或者tab html：5 回车或者tab -->
<!-- 标准的html5文档头声明 -->
<!DOCTYPE html>
<!-- 语言是English -->
<html lang="en">
<!-- 元信息 不会直接显示在浏览器中-->

<head>
    <!-- 元信息 字符编码 utf8 -->
    <meta charset="UTF-8">
    <!-- 元信息 设置宽度为设备宽度 初始默认比例为1 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 选项卡标题 -->
    <title>2026-1-19</title>
    <!-- 选项卡图标 link标签除了可以设置图标外 还可以引用外部样式 -->
    <link rel="icon" href="https://www.firefox.com/media/img/favicons/firefox/browser/favicon-196x196.59e3822720be.png">
    <style>
        div{
            width: 100px;
            height: 100px;
            background-color: red;
            margin-top: 10px;
        }
        span{
            width: 100px;
            height: 100px;
            background-color: blue;  
        }
    </style>
</head>
    <!-- 文档体部标签 -->
<body>
    <!-- 网页组成部分是元素/标签 从功能上划分 块级元素 行内元素 常见标签 -->
    
    <!--
        块级元素特点?
        1.独占一行空间
        2.高度默认由元素内容撑起
        3.可以通过css属性设置宽高
        4.宽度默认100%
    -->
    <div>块级元素</div>
    <div>块级元素</div>
    <p>段落标签</p>
    <section>块级元素</section>
    <h1>一级标题</h1>
    <h2>二级标题</h2>
    <h3>三级标题</h3>
    <h4>四级标题</h4>
    <h5>五级标题</h5>
    <h6>六级标题</h6>
    <header>头部内容</header>
    <footer>尾部内容</footer>
    <nav>导航标签</nav>
    <article>文章内容</article>
    <!--
        行内元素特点: 
        1.行内元素共享一行空间
        2.元素高度默认由元素内容撑起
        3.无法通过css属性设置宽高
    -->
    <span>行内元素</span>
    <span>行内元素</span>
    <strong>加粗标签</strong>
    <i>斜体标签</i>
    <b>加粗标签</b>
    <em>斜体标签</em>
    <sub>下标标签</sub>
    <sup>上标标签</sup>
</body>
</html>
