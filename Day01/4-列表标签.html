<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 列表标签
        ol li块级元素
        有序列表
        设置列表标志项 type A a 1 i I
    -->
    <ol type="i">
        <li>上海市</li>
        <li>北京市</li>
        <li>太原市</li>
    </ol>
    <!-- 无序列表
        ul li也是块级元素
        circle 空心圆
        desc 实心圆
        square 方块
    -->
    <ul type="square">
        <li>男装</li>
        <li>女装</li>
        <li>童装</li>
    </ul>
</body>
</html>
