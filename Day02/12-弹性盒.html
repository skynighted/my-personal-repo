<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 
            弹性盒/伸缩盒
            一旦给元素设置display:flex，该元素成为弹性盒，子元素成为弹性元素
            弹性元素沿着主轴方向排列
        */
        .parent{
            width: 500px;
            height: 400px;
            border: 1px solid cyan;
            margin: 50px auto;
            /* 开启弹性盒 */
            display: flex;
            /* 更改主轴排列方向 row row-reverse column column-reverse */
            /* flex-direction: column; */
            /* 默认情况下 弹性元素超过弹性盒宽是不会换行显示 而是会进行等比例压缩 */
            /* 设置换行显示 nowrap默认值 wrap换行显示 */
            /* flex-wrap: wrap; */
            /* flex-flow:是flow-direction 和 flex-wrap简写 */
            /* flex-flow: row wrap; */

            /* 设置弹性元素在主轴对齐方式
                flex-start
                flex-end
                center
                space-around
                space-between
                space-evenly
            
            */
            justify-content: flex-start;

            /* 设置弹性元素在交叉轴对齐方式
                flex-start
                center
                flex-end
                stretch 平铺 拉伸 占满弹性盒容器高度
            */
            /* align-items: stretch; */
        }
        .child{
            /* width: 100px; */
            height: 50px;
            color: white;
            flex:1;
        }
        .two{
            flex: 2;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child" style="background-color: red;">弹性元素1</div>
        <div class="child two" style="background-color: green;">弹性元素2</div>
        <div class="child" style="background-color: blue;">弹性元素3</div>
        <!-- <div class="child" style="background-color: red;">弹性元素1</div>
        <div class="child" style="background-color: green;">弹性元素2</div>
        <div class="child" style="background-color: blue;">弹性元素3</div> -->
    </div>
</body>
</html>
