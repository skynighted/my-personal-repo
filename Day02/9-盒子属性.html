<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 100px;
            height: 100px;
            /* 边框 */
            border: 5px solid red;
            /* 内边距 */
            padding: 10px;
            /* 外边距 上下左右外边距都为10px */
            margin: 10px;
            /* 上下外边距为10px 左右外边距为20px */
            margin: 10px 20px;
            /* 上外边距为10px 左右为20px 下外边距为30px */
            margin: 10px 20px 30px;
            /* 上外边距为10px 右外边距为20px 下外边距为30px 左外边距为40px */
            margin: 10px 20px 30px 40px;
        }
    </style>
</head>
<body>
    <div>块级元素</div>
</body>
</html>
